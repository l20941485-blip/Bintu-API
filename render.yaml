services:
  - type: web
    name: bintu-data-extraction-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium
    # Trust X-Forwarded-For only from Render's own proxy range; '*' would let any
    # caller spoof the client IP and bypass the burst guard entirely.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='100.64.0.0/10' --no-access-log
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: API_KEY
        generateValue: true
      # Optional scoped key for MCP clients (Claude connectors, Claude Code):
      # accepted only on /mcp and /mcp/tools*, never on REST routes or
      # /metrics. Set in the dashboard when sharing connector access; empty
      # keeps the master API_KEY working on /mcp as before.
      - key: MCP_API_KEY
        sync: false
      - key: RAPIDAPI_PROXY_SECRET
        sync: false
      # Fail closed in production: if both secrets above are ever empty
      # (cleared env vars), requests are rejected with 500
      # auth_misconfiguration instead of the service silently running open.
      - key: REQUIRE_AUTH
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Off by default on free infra (Chromium boot = latency + RAM).
      # Set to "true" only on paid plans where rendering cost is covered.
      - key: RENDER_JS_ENABLED
        value: "false"