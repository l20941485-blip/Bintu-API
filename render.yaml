services:
  - type: web
    name: bintu-data-extraction-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Trust X-Forwarded-For only from Render's own proxy range; '*' would let any
    # caller spoof the client IP and bypass the burst guard entirely.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='100.64.0.0/10' --no-access-log
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: API_KEY
        generateValue: true
      - key: RAPIDAPI_PROXY_SECRET
        sync: false