name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests
         env:
          API_KEY: ci_test_placeholder_key_string_32_chars_long
          BINTU_API_KEY: ci_test_placeholder_key_string_32_chars_long
          BINTU_BASE_URL: http://127.0.0.1:8000
          BINTU_SMOKE_TARGET_URL: http://127.0.0.1:8000
          RAPIDAPI_PROXY_SECRET: ci_test_placeholder_proxy_secret_string
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v