name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run offline test suite
        env:
          API_KEY: ci_test_placeholder_key_string_32_chars_long
          BINTU_API_KEY: ci_test_placeholder_key_string_32_chars_long
          BINTU_BASE_URL: http://127.0.0.1:8000
          BINTU_SMOKE_TARGET_URL: http://127.0.0.1:8000
          RAPIDAPI_PROXY_SECRET: ci_test_placeholder_proxy_secret_string
        run: |
          python -m pytest tests -q --ignore=tests/regression/test_bintu_full_suite.py --ignore=tests/regression/test_bintu_regressions.py


