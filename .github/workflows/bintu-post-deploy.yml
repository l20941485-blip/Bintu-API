name: bintu-post-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wait-for-render-deploy:
    name: Wait for the Render deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY secret is missing."
            exit 1
          fi
          echo "RENDER_API_KEY is configured."

      - name: Wait for Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import os, time, urllib.request, urllib.error

          key = os.environ["RENDER_API_KEY"]
          service_id = os.environ.get("RENDER_SERVICE_ID", "")

          if not service_id:
              print("RENDER_SERVICE_ID is not set; skipping active deploy polling.")
              raise SystemExit(0)

          url = f"https://api.render.com/v1/services/{service_id}/deploys?limit=1"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {key}",
              "Accept": "application/json",
          })

          deadline = time.time() + 900
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read().decode("utf-8")
                  print(data[:1000])
                  if '"status":"live"' in data or '"status": "live"' in data:
                      print("Render deployment is live.")
                      raise SystemExit(0)
              except Exception as exc:
                  print(f"Render API check failed: {exc}")
              time.sleep(20)

          raise SystemExit("Timed out waiting for Render deployment.")
          PY

  regression-suite:
    name: Regression suite against production
    needs: wait-for-render-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run regression suite
        env:
          BINTU_TOKEN: ${{ secrets.BINTU_TOKEN }}
          BINTU_BASE_URL: https://bintu-mcp.onrender.com
        run: |
          python -m pytest tests/regression/test_bintu_regressions.py -v -rxXs
