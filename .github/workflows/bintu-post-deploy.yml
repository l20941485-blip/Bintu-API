name: bintu-post-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-suite:
    name: Regression suite against production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run regression suite
        env:
          BINTU_TOKEN: ${{ secrets.BINTU_TOKEN }}
          BINTU_URL: https://bintu-api.onrender.com
        run: |
          python -m pytest tests/regression/test_bintu_regressions.py -vv -rxXs
