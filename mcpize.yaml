version: 1
name: bintu-data-extraction-api
description: Token-Sanitized Context Gateway for AI agents — one public URL to readable text with deterministic max_tokens chunks, tokens/cache_hit/tokens_saved_estimate on every call. Stateless Streamable HTTP, 1 MiB cap, auth-gated execution. Pitch aliases: chunked, chunk_token_budget.
runtime: python
entry: main.py
build:
  install: pip install -r requirements.txt
startCommand:
  type: http
  command: uvicorn main:app --host 0.0.0.0 --port $PORT --no-access-log
configSchema:
  source: code
